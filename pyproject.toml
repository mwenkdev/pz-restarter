[project]
name = "pz-restarter"
version = "0.1.1"
description = "Web page that restarts the Project Zomboid server only when nobody is online"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "kubernetes>=31.0",
    # eMudhra CA distrust (CVE-2026-111943/111944); pulled in transitively via kubernetes
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pz_restarter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
